spring:
  # Настройки базы данных
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver

  # Настройки JPA
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
    open-in-view: false

  # Jackson настройки
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# Настройки логирования
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
      springframework:
        security: DEBUG
        web: DEBUG
    com:
      example:
        demo: DEBUG

# Настройки сервера
server:
  port: 8080

# Настройки Swagger/OpenAPI (если используете)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
